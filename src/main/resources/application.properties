spring.application.name=prayer

## 기존 .env를 읽습니다.
spring.config.import=optional:file:.env[.properties]   

# DB 주소·사용자·비밀번호를 지정합니다. 현재는 .env의 POSTGRES_* 값을 사용하고, 추후 DB_URL·DB_USERNAME·DB_PASSWORD가 제공되면 해당 값을 우선 사용

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: DB 스키마 변경 이력 관리
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# 상태 확인과 API 문서
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.disable-swagger-default-url=true
