spring.application.name=prayer

## ?? .env? ????.
spring.config.import=optional:file:.env[.properties]

# Spring Datasource
# Postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway: ??? ?? ?? ??
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.disable-swagger-default-url=true

# Spring Security
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.provider.kakao.jwk-set-uri=https://your-subdomain.oktapreview.com/oauth2/v1/keys

# logging
logging.charset.console=UTF-8
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# ?? ??? ??: SQL ???? ??? ??
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.ubique.prayer.communityunit=DEBUG
